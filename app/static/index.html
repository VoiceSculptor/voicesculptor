<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声刻 Studio · 本地语音克隆</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c2230; --line:#2a3240;
    --text:#e6edf3; --muted:#8b949e; --accent:#4f8cff; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:17px;margin:0;letter-spacing:.5px}
  header .sub{color:var(--muted);font-size:12px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px}
  .main{display:grid;grid-template-columns:270px 1fr 320px;gap:16px;padding:16px;max-width:1500px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .panel h2{font-size:13px;color:var(--muted);margin:0 0 10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
  .voice{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:6px}
  .voice:hover{background:var(--panel2)}
  .voice.active{border-color:var(--accent);background:rgba(79,140,255,.12)}
  .voice .emoji{font-size:16px}
  .voice .nm{font-weight:600}
  .voice .pr{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  textarea{width:100%;min-height:96px;resize:vertical;background:var(--panel2);border:1px solid var(--line);
    color:var(--text);border-radius:9px;padding:11px;font:inherit;outline:none}
  textarea:focus{border-color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
  .chip{padding:6px 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;font-size:13px}
  .chip.active{background:rgba(79,140,255,.18);border-color:var(--accent);color:#cfe0ff}
  .row{display:flex;align-items:center;gap:10px;margin:9px 0;flex-wrap:wrap}
  .row label{color:var(--muted);min-width:64px;font-size:12px}
  input[type=range]{flex:1;accent-color:var(--accent)}
  select,input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:8px;padding:7px 9px;font:inherit;outline:none}
  button{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.55;cursor:not-allowed}
  button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line);font-weight:500}
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .metric{background:var(--panel2);border-radius:9px;padding:9px 10px}
  .metric .k{color:var(--muted);font-size:11px}
  .metric .v{font-size:16px;font-weight:700;margin-top:2px}
  audio{width:100%;margin-top:12px;filter:invert(.92) hue-rotate(180deg)}
  .log{background:#0b0e13;border:1px solid var(--line);border-radius:9px;padding:10px;height:150px;overflow:auto;
    font:12px/1.5 Consolas,monospace;color:#9fb0c6;white-space:pre-wrap}
  .hint{color:var(--muted);font-size:12px}
  .badge{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .upload{border:1px dashed var(--line);border-radius:9px;padding:10px;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:500}
</style>
</head>
<body>
<header>
  <h1>声刻 Studio</h1>
  <span class="sub">本地语音克隆 · CosyVoice3 + campplus 评测</span>
  <span style="flex:1"></span>
  <span class="badge" id="engines">检测中…</span>
</header>


<div id="connBanner" style="display:none;margin:0;padding:10px 22px;background:#3d1d1d;border-bottom:1px solid #f85149;color:#ffb3ae;font-size:13px">
  <b>⚠ 无法连接后端服务</b> ——
  请确认：① 你是用 <code>http://127.0.0.1:8091</code> 打开的（不是直接双击 index.html）；
  ② 启动脚本的黑色窗口还开着且没有报错；③ 端口 8091 没被占用。
  <span id="connDetail" style="opacity:.75"></span>
</div>

<div class="main">
  <!-- 左：音色 -->
  <div class="panel">
    <h2>音色库</h2>
    <div id="voices"></div>
    <div class="upload">
      <div class="hint">新建音色</div>
      <input type="text" id="newName" placeholder="名称，如 洛琪希" style="width:100%;margin-top:6px">
      <input type="text" id="newPrompt" placeholder="参考音频的逐字转录" style="width:100%;margin-top:6px">
      <input type="file" id="newFile" accept="audio/*" style="width:100%;margin-top:6px;color:var(--muted)">
      <button class="ghost" style="margin-top:8px;width:100%" onclick="createVoice()">上传并建立音色</button>
    </div>
  </div>

  <!-- 中：合成 -->
  <div class="panel">
    <h2>合成</h2>
    <textarea id="text" placeholder="输入要合成的文本…">欢迎来到声刻，今天也请多关照。</textarea>
    <div class="row"><label>情绪</label><div class="chips" id="emotions"></div></div>
    <div class="row">
      <label>语速</label>
      <input type="range" id="speed" min="0.7" max="1.3" step="0.05" value="1">
      <span id="speedVal" class="badge">1.00</span>
    </div>
    <div class="row">
      <label>质量</label>
      <select id="quality">
        <option value="balanced">balanced · 单次（快）</option>
        <option value="best">best · 多候选择优（慢）</option>
      </select>
      <label style="min-width:52px">候选</label>
      <input type="number" id="bestN" min="1" max="4" value="2" style="width:64px">
      <label style="min-width:52px">校验</label>
      <input type="checkbox" id="verify" checked>
    </div>
    <div class="row">
      <button id="genBtn" onclick="generate()">生成语音</button>
      <button class="ghost" onclick="document.getElementById('text').value='';">清空</button>
      <span class="hint">参考：4~6 秒、干净、情绪贴合</span>
    </div>
    <div class="metrics">
      <div class="metric"><div class="k">相似度 SIM</div><div class="v" id="mSim">—</div></div>
      <div class="metric"><div class="k">时长</div><div class="v" id="mDur">—</div></div>
      <div class="metric"><div class="k">耗时</div><div class="v" id="mLat">—</div></div>
      <div class="metric"><div class="k">情绪</div><div class="v" id="mEmo">—</div></div>
    </div>
    <audio id="player" controls></audio>
  </div>

  <!-- 右：体检 + 日志 -->
  <div class="panel">
    <h2>素材体检</h2>
    <input type="text" id="auditDir" placeholder="录音文件夹路径，如 E:\\voice-record" style="width:100%">
    <button class="ghost" style="margin-top:8px;width:100%" onclick="runAudit()">运行体检</button>
    <div id="auditOut" class="log" style="height:180px;margin-top:10px">等待运行…</div>
    <h2 style="margin-top:16px">日志</h2>
    <div id="log" class="log"></div>
  </div>
</div>

<script>
const EMOTIONS = ['撒娇','开心','难过','生气','平静','惊讶'];
let state = { voice: null, emotion: '平静' };

function log(msg){
  const el = document.getElementById('log');
  const t = new Date().toLocaleTimeString();
  el.textContent = `[${t}] ${msg}\n` + el.textContent;
  if (el.textContent.length > 8000) el.textContent = el.textContent.slice(0, 8000);
}

function showConnError(msg){
  const b = document.getElementById('connBanner');
  const d = document.getElementById('connDetail');
  if (b) b.style.display = 'block';
  if (d) d.textContent = msg ? ('（' + msg + '）') : '';
}
function hideConnError(){
  const b = document.getElementById('connBanner');
  if (b) b.style.display = 'none';
}

async function api(path, opts){
  let r;
  try {
    r = await fetch(path, opts);
  } catch (e) {
    showConnError('网络请求失败: ' + (e && e.message ? e.message : e));
    throw new Error('无法连接后端，请确认启动脚本窗口仍在运行，并通过 http://127.0.0.1:8091 打开');
  }
  if (!r.ok){
    let detail = await r.text().catch(()=> '');
    throw new Error(`HTTP ${r.status} ${detail.slice(0,200)}`);
  }
  hideConnError();
  return r.json();
}

async function loadHealth(){
  try{
    const h = await api('/api/health');
    const e = h.engines || {};
    const parts = [];
    for (const [k,v] of Object.entries(e)) parts.push(`<span class="dot" style="background:${v?'var(--ok)':'var(--bad)'}"></span>${k}`);
    document.getElementById('engines').innerHTML = parts.join(' &nbsp; ');
  }catch(err){
    document.getElementById('engines').textContent = '服务不可用';
  }
}

async function loadVoices(){
  const box = document.getElementById('voices');
  try{
    const d = await api('/api/voices');
    box.innerHTML = '';
    if (!d.voices.length){ box.innerHTML = '<div class="hint">还没有音色，请上传参考音频</div>'; return; }
    for (const v of d.voices){
      const el = document.createElement('div');
      el.className = 'voice' + (state.voice === v.voice_id ? ' active' : '');
      el.innerHTML = `<span class="emoji">${v.emoji||'★'}</span>
        <div style="flex:1;min-width:0"><div class="nm">${v.name}</div>
        <div class="pr">${(v.prompt||'').slice(0,26)||'（无转录）'}</div></div>`;
      el.onclick = ()=>{ state.voice = v.voice_id; loadVoices(); log(`选择音色：${v.name}`); };
      box.appendChild(el);
    }
    if (!state.voice && d.voices.length){ state.voice = d.voices[0].voice_id; loadVoices(); }
  }catch(err){
    box.innerHTML = `<div class="hint" style="color:var(--bad)">${err.message}</div>`;
  }
}

function renderEmotions(){
  const box = document.getElementById('emotions');
  box.innerHTML = '';
  for (const e of EMOTIONS){
    const el = document.createElement('div');
    el.className = 'chip' + (state.emotion === e ? ' active' : '');
    el.textContent = e;
    el.onclick = ()=>{ state.emotion = e; renderEmotions(); };
    box.appendChild(el);
  }
}

async function generate(){
  if (!state.voice) return log('请先选择一个音色');
  const text = document.getElementById('text').value.trim();
  if (!text) return log('文本为空');
  const btn = document.getElementById('genBtn');
  btn.disabled = true; btn.textContent = '生成中…';
  const t0 = performance.now();
  try{
    const fd = new FormData();
    fd.append('voice_id', state.voice);
    fd.append('text', text);
    fd.append('emotion', state.emotion);
    fd.append('speed', document.getElementById('speed').value);
    fd.append('quality', document.getElementById('quality').value);
    fd.append('best_n', document.getElementById('bestN').value);
    fd.append('verify', document.getElementById('verify').checked ? 'true' : 'false');
    const d = await api('/api/tts', { method:'POST', body: fd });
    const bytes = Uint8Array.from(atob(d.audio_base64), c=>c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], {type:'audio/wav'}));
    document.getElementById('player').src = url;
    document.getElementById('player').play().catch(()=>{});
    document.getElementById('mSim').textContent = d.sim.toFixed(3);
    document.getElementById('mDur').textContent = d.duration.toFixed(2) + 's';
    document.getElementById('mLat').textContent = d.latency.toFixed(1) + 's';
    document.getElementById('mEmo').textContent = (d.emotion_detected || '—') + (d.emotion_detected === d.emotion_target ? ' ✓' : '');
    log(`合成完成 · ${d.engine}/${d.mode} · SIM=${d.sim} · ${d.duration}s · 候选${d.candidates}`);
  }catch(err){
    log('合成失败：' + err.message);
  }finally{
    btn.disabled = false; btn.textContent = '生成语音';
  }
}

async function createVoice(){
  const name = document.getElementById('newName').value.trim();
  const prompt = document.getElementById('newPrompt').value.trim();
  const file = document.getElementById('newFile').files[0];
  if (!name || !file) return log('需要名称 + 参考音频');
  const fd = new FormData();
  fd.append('name', name); fd.append('prompt', prompt); fd.append('ref', file);
  try{
    const d = await api('/api/voices', { method:'POST', body: fd });
    log(`新建音色：${d.name}`);
    state.voice = d.voice_id;
    loadVoices();
  }catch(err){ log('新建失败：' + err.message); }
}

async function runAudit(){
  const dir = document.getElementById('auditDir').value.trim();
  if (!dir) return log('请输入录音目录');
  const out = document.getElementById('auditOut');
  out.textContent = '体检中…';
  const fd = new FormData(); fd.append('dir_path', dir);
  try{
    const d = await api('/api/audit', { method:'POST', body: fd });
    out.textContent = d.report || d.stdout || '（无输出）';
    log('体检完成');
  }catch(err){ out.textContent = '体检失败：' + err.message; }
}

document.getElementById('speed').addEventListener('input', e=>{
  document.getElementById('speedVal').textContent = Number(e.target.value).toFixed(2);
});

renderEmotions();
loadHealth(); loadVoices();
setInterval(loadHealth, 15000);
</script>
</body>
</html>
